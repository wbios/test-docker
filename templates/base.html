<!doctype html>
<html lang="it">
<head>
	<meta chatset="utf-8">
	<title> {% block title %}Gestione utenti {% endblock %} </title>
</head>

<body>

	{% with messages = get_flashed_messages() %}
		{% if messages %}
			{% for message in messages %}
				<p>{{ message }}</p>
			{% endfor %}
		{% endif %}
	{% endwith %}

	{% block content %}
	{% endblock %}


</body>

</html>
