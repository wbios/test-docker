<!doctype html>
<html lang="it">
<head>
	<meta charset="utf-8">
	<title> Modifica utente</title>
</head>

<body>
	
	{% with messages = get_flashed_messages() %}
		{% if messages %}
			{% for message in messages %}
				<p>{{ message }}</p>
			{% endfor %}
		{% endif %}
	{% endwith%}

	<h1>Modifica Utente H1</h1>

	<form method="POST" action="/update/{{ user[0]}}">
		<input type="text" name="name" value="{{ user[1]}}">
		<button type="submit"> Salva</button>
	</form>
	
	<p>
		<a href="/">Torna agli utenti</a>
	</p>
</body>

</html>
